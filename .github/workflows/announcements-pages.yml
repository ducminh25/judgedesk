name: Admin announcements
on:
  pull_request:
    paths: ["announcements/**", ".github/workflows/announcements-pages.yml"]
  push:
    branches: [main]
    paths: ["announcements/**", ".github/workflows/announcements-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: announcements-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publisher_sha: ${{ steps.pin.outputs.publisher_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: content
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      # Resolver itself must be reviewed in this protected workflow. The initial
      # bootstrap checkout uses the separately approved repo variable, never a PR pin.
      - name: Require an explicit full source pin before any tool checkout
        env:
          APPROVED_SOURCE_PIN: ${{ vars.ANNOUNCEMENTS_PUBLISHER_SOURCE_COMMIT }}
        shell: bash
        run: '[[ "$APPROVED_SOURCE_PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing approved full publisher SHA" >&2; exit 1; }'
      - name: Checkout approved resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ducminh25/judgedesk-source
          ref: ${{ vars.ANNOUNCEMENTS_PUBLISHER_SOURCE_COMMIT }}
          path: resolver
          persist-credentials: false
      - name: Resolve pin from trusted main or PR base
        id: pin
        env:
          ANNOUNCEMENTS_PUBLISHER_SOURCE_COMMIT: ${{ vars.ANNOUNCEMENTS_PUBLISHER_SOURCE_COMMIT }}
          ANNOUNCEMENTS_BOOTSTRAP_COMMIT: ${{ vars.ANNOUNCEMENTS_BOOTSTRAP_COMMIT }}
        run: node resolver/scripts/announcements/resolve-publisher-pin.mjs content
      - name: Checkout pinned publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ducminh25/judgedesk-source
          ref: ${{ steps.pin.outputs.publisher_sha }}
          path: tools
          persist-credentials: false
      - name: Checkout previous content
        if: steps.pin.outputs.previous_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pin.outputs.previous_sha }}
          path: previous
          persist-credentials: false
      - name: Install build dependencies without lifecycle scripts
        working-directory: tools
        run: npm ci --ignore-scripts
      - name: Build and validate author content (no signing secret)
        env:
          PREVIOUS_SHA: ${{ steps.pin.outputs.previous_sha }}
        run: |
          if [ -n "$PREVIOUS_SHA" ]; then
            node --import ./tools/node_modules/tsx/dist/loader.mjs tools/scripts/announcements/publisher-cli.ts build content "$RUNNER_TEMP/unsigned" previous
          else
            node --import ./tools/node_modules/tsx/dist/loader.mjs tools/scripts/announcements/publisher-cli.ts build content "$RUNNER_TEMP/unsigned"
          fi
      - name: Upload unsigned intermediate only for main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: announcements-unsigned
          path: ${{ runner.temp }}/unsigned
          if-no-files-found: error
          retention-days: 1
  sign:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: announcements-signing
    permissions:
      contents: read
      deployments: read
    outputs:
      bootstrap_receipt: ${{ steps.signing.outputs.bootstrap_receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ducminh25/judgedesk-source
          ref: ${{ needs.build.outputs.publisher_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: announcements-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Guard production baseline and sign (built-ins only; no npm install)
        id: signing
        env:
          GH_TOKEN: ${{ github.token }}
          ANNOUNCEMENTS_SIGNING_PRIVATE_KEY: ${{ secrets.ANNOUNCEMENTS_SIGNING_PRIVATE_KEY }}
          ANNOUNCEMENTS_KEY_ID: ${{ vars.ANNOUNCEMENTS_KEY_ID }}
          ANNOUNCEMENTS_BOOTSTRAP_COMMIT: ${{ vars.ANNOUNCEMENTS_BOOTSTRAP_COMMIT }}
          ANNOUNCEMENTS_PUBLISHER_SOURCE_COMMIT: ${{ vars.ANNOUNCEMENTS_PUBLISHER_SOURCE_COMMIT }}
          PUBLISHER_SHA: ${{ needs.build.outputs.publisher_sha }}
        run: node tools/scripts/announcements/sign-publish.mjs "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/signed-site" tools/shared/announcements-trust.json "$ANNOUNCEMENTS_KEY_ID" "$GITHUB_SHA" "$PUBLISHER_SHA"
      - name: Upload signed Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4; internal upload action also SHA-pinned
        with:
          path: ${{ runner.temp }}/signed-site
      - name: Retain signed site for independent deployment guard/smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: announcements-signed
          path: ${{ runner.temp }}/signed-site
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ducminh25/judgedesk-source
          ref: ${{ needs.build.outputs.publisher_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: announcements-signed
          path: ${{ runner.temp }}/signed-site
      - name: Recheck main HEAD and deployed sequence immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ANNOUNCEMENTS_BOOTSTRAP_RECEIPT: ${{ needs.sign.outputs.bootstrap_receipt }}
        run: node tools/scripts/announcements/publication-guard.mjs predeploy tools/shared/announcements-trust.json "$RUNNER_TEMP/signed-site/announcements/v1/feed.json" "$GITHUB_SHA"
      - name: Deploy signed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live feed and sample media with bounded propagation retry
        run: node tools/scripts/announcements/publication-guard.mjs smoke tools/shared/announcements-trust.json "$RUNNER_TEMP/signed-site/announcements/v1/feed.json"
